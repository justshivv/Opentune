<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="color-scheme" content="dark" />
    <title>NepTune: lyric sources</title>
  </head>
  <body>
    <main class="card">
      <img src="/icon/48.png" width="40" height="40" alt="" />
      <h1>Allow lyric sources</h1>

    <script type="module" src="./main.ts"></script>
