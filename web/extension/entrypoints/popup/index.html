<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="color-scheme" content="dark" />
    <title>NepTune</title>
  </head>
  <body class="popup">
    <header class="header">
      <img class="logo" src="/icon/48.png" width="28" height="28" alt="" />
      <span class="name">NepTune</span>
      <span class="version" id="version"></span>
    </header>

    <div id="access"></div>

    <section class="section" aria-labelledby="player-heading">
      <h2 id="player-heading">Player</h2>
      <ul class="group" id="player"></ul>
    </section>

    <section class="section" aria-labelledby="accounts-heading">
      <h2 id="accounts-heading">Accounts</h2>
      <ul class="group" id="integrations"></ul>
    </section>

    <section class="section" aria-labelledby="lyrics-heading">
      <h2 id="lyrics-heading">Lyric sources <span class="count" id="lyrics-count"></span></h2>
      <ul class="group" id="lyrics"></ul>
    </section>

    <section class="section" id="addons-section" aria-labelledby="addons-heading" hidden>
      <h2 id="addons-heading">Audio add-ons</h2>
      <ul class="group" id="addons"></ul>
    </section>

    <footer class="footer">
      <button class="primary" id="open" type="button">Open player</button>
      <div id="updates" aria-label="Extension updates"></div>
    </footer>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
