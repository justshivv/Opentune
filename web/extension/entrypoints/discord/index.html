<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="color-scheme" content="dark" />
    <title>NepTune: connect Discord</title>
  </head>
  <body>
    <main class="card">
      <img src="/icon/48.png" width="40" height="40" alt="" />
      <h1>Show what you’re playing on Discord</h1>
      <p>
        NepTune reads your Discord session from a discord.com tab and keeps it in this extension. The web player never
        sees it.
      </p>
      <p class="warning">This uses your account’s own token, which Discord’s terms don’t allow. Use it at your own risk.</p>
      <button id="connect">Connect Discord</button>
      <p id="status" class="status" role="status"></p>
    </main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
