# Every push and pull request: build, unit tests, lint, and the shrunk
# release APKs, so a change that breaks any of them shows up here first.
name: CI

on:
  push:
    branches: ["**"]
    tags-ignore: ["v*"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Usage deduplication and website scripts
        run: |
          node --test usage-api/worker.test.mjs usage-api/addons.test.mjs usage-api/dashboard/model.test.mjs examples/audio-addon/worker.test.mjs
          node --test services/lossless-addon/control.test.mjs services/lossless-addon/server.test.mjs services/lossless-addon/cache.test.mjs services/lossless-addon/pool.test.mjs services/lossless-addon/usage-server.test.mjs services/lossless-addon/worker.test.mjs services/lossless-addon/control-ui.test.mjs
          node --check services/lossless-addon/control.js
          node --check usage-api/dashboard/dashboard.js
          node --check site/download-tracking.js

      - name: Package Hostinger backend
        run: |
          bash services/lossless-addon/vps/pack.sh hostinger-package
          timeout 90s node scripts/check-hostinger-package.mjs hostinger-package/opentune-hostinger.zip
      - uses: actions/upload-artifact@v4
        with:
          name: opentune-hostinger
          path: hostinger-package/

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      # compileSdk 37 (InnerTubeX's AAR is built against it) and the build
      # tools. The packages are named because the action's default list
      # includes "tools", which the current SDK manager no longer has.
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-37.0 build-tools;36.0.0

      - uses: gradle/actions/setup-gradle@v4

      - name: Build, unit tests and lint
        run: ./gradlew --no-daemon assembleDebug testDebugUnitTest lintDebug

      - name: Release build (R8 shrinking)
        run: ./gradlew --no-daemon assembleRelease

      - name: Test and lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            app/build/reports/
            app/build/test-results/
            app/build/screenshots/
            core/build/reports/
            core/build/test-results/
            wear/build/reports/
            wear/build/test-results/
            wear/build/screenshots/
          if-no-files-found: ignore

      - name: APKs
        uses: actions/upload-artifact@v4
        with:
          name: apks
          path: |
            app/build/outputs/apk/release/*.apk
            wear/build/outputs/apk/release/*.apk

  # The desktop app: its tests, and an installer for each system.
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            package: packageDeb
          - os: windows-latest
            package: packageMsi
          - os: macos-latest
            package: packageDmg
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      # The build includes the Android modules, which need the SDK to configure.
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-37.0 build-tools;36.0.0
      - uses: gradle/actions/setup-gradle@v4
      - name: Desktop tests and installer
        shell: bash
        env:
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          LASTFM_API_SECRET: ${{ secrets.LASTFM_API_SECRET }}
        run: ./gradlew --no-daemon :desktop:test :desktop:${{ matrix.package }}
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.os }}
          path: |
            desktop/build/compose/binaries/main/deb/*.deb
            desktop/build/compose/binaries/main/msi/*.msi
            desktop/build/compose/binaries/main/dmg/*.dmg
          if-no-files-found: error

  website:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install playwright==1.58.0
      - run: python -m playwright install --with-deps chromium
      - run: python scripts/check-distribution.py
      - run: python scripts/check-social-preview.py
      - run: node --test scripts/check-spotify-callback.cjs
      - run: python scripts/prepare-usage-assets.py
      - run: python scripts/check-app-controls.py
      - run: python scripts/check-website.py
      - run: python scripts/check-room-invite.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: website-reports
          path: website-reports/
