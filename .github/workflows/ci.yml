# Every push and pull request: build, unit tests, lint, and the shrunk
# release APKs, so a change that breaks any of them shows up here first.
name: CI

on:
  push:
    branches: ["**"]
    tags-ignore: ["v*"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Usage deduplication and website scripts
        run: |
          node --test usage-api/worker.test.mjs usage-api/dashboard/model.test.mjs
          node --check usage-api/dashboard/dashboard.js
          node --check site/download-tracking.js

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      # compileSdk 37 (InnerTubeX's AAR is built against it) and the build
      # tools. The packages are named because the action's default list
      # includes "tools", which the current SDK manager no longer has.
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-37.0 build-tools;36.0.0

      - uses: gradle/actions/setup-gradle@v4

      - name: Fetch pinned provider fixtures
        run: python3 scripts/fetch-provider-fixtures.py

      - name: Lossless download regressions
        run: ./gradlew --no-daemon testDebugUnitTest --tests '*ExtensionProtocolTest' --tests '*ExtensionSessionManagerTest' --tests '*AmazonAdapterTest' --tests '*LosslessStoreTest' --tests '*LosslessCardTest' --tests '*ProviderReturnLinkDialogTest' --tests '*ProviderRuntimeTest' --tests '*ProviderPackageTest' --tests '*DownloadNetworkTest' --tests '*DownloadMatchTest' --tests '*DownloadQualitySheetTest'

      - name: Build, unit tests and lint
        run: ./gradlew --no-daemon assembleDebug testDebugUnitTest lintDebug

      - name: Lossless test failure details
        if: failure()
        run: |
          python3 - <<'PYTEST'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          for path in Path('app/build/test-results').rglob('TEST-*.xml'):
              for case in ET.parse(path).getroot().findall('testcase'):
                  for failure in case.findall('failure'):
                      print(case.attrib.get('name', ''))
                      print(failure.attrib.get('message', ''))
                      print((failure.text or '')[:8000])
          PYTEST

      - name: Release build (R8 shrinking)
        run: ./gradlew --no-daemon assembleRelease

      - name: Test and lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            app/build/reports/
            app/build/test-results/
            app/build/screenshots/
          if-no-files-found: ignore

      - name: APKs
        uses: actions/upload-artifact@v4
        with:
          name: apks
          path: app/build/outputs/apk/release/*.apk

  website:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install playwright==1.58.0
      - run: python -m playwright install --with-deps chromium
      - run: python scripts/check-distribution.py
      - run: python scripts/check-social-preview.py
      - run: node --test scripts/check-spotify-callback.cjs
      - run: python scripts/prepare-usage-assets.py
      - run: python scripts/check-website.py
      - run: python scripts/check-room-invite.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: website-reports
          path: website-reports/
