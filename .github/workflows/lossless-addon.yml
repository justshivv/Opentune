name: Lossless add-on
on:
  push:
    paths:
      - 'services/lossless-addon/**'
      - '.github/workflows/lossless-addon.yml'
  pull_request:
    paths:
      - 'services/lossless-addon/**'
      - '.github/workflows/lossless-addon.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: lossless-addon-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --test services/lossless-addon/*.test.mjs
      - name: Check real Cloudflare crypto runtime
        env:
          ATTESTATION_TEST_FIXTURE: ${{ runner.temp }}/attestation-test-fixture.json
          RUNTIME_MODULES: ${{ runner.temp }}/worker-runtime/node_modules
        run: |
          node services/lossless-addon/attestation.test.mjs
          npm install --prefix "$RUNNER_TEMP/worker-runtime" --no-save miniflare@4 esbuild
          node services/lossless-addon/check-worker-runtime.mjs
  probe:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check upstream availability (not a playback test)
        run: node services/lossless-addon/probe.mjs lossless-source-report.json
      - name: Inspect Lossless Bridge public sources
        run: node services/lossless-addon/probe-bridge.mjs
      - name: Inspect Eljohnzc public entry points
        run: node services/lossless-addon/probe-eljohnzc.mjs
      - name: Check deployed source and media path for reported artist
        run: node services/lossless-addon/probe-client-path.mjs
      - name: Probe additional public source candidates
        run: node services/lossless-addon/probe-candidates.mjs
      - name: Investigate additional source APIs
        run: node services/lossless-addon/probe-discovery.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: lossless-source-report
          path: |
            lossless-source-report.json
            lossless-candidate-report.json
            lossless-discovery-report.json
            lossless-bridge-report.json
            eljohnzc-public-report.json
