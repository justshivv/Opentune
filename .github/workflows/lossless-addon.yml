name: Lossless add-on
on:
  push:
    paths:
      - 'services/lossless-addon/**'
      - '.github/workflows/lossless-addon.yml'
  pull_request:
    paths:
      - 'services/lossless-addon/**'
      - '.github/workflows/lossless-addon.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: lossless-addon-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --test services/lossless-addon/worker.test.mjs
  probe:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check upstream availability (not a playback test)
        run: node services/lossless-addon/probe.mjs lossless-source-report.json
      - uses: actions/upload-artifact@v4
        with:
          name: lossless-source-report
          path: lossless-source-report.json
