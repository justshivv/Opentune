name: Usage API
on:
  push:
    branches: [main]
    paths: ["usage-api/**", "scripts/prepare-usage-assets.py", ".github/workflows/usage-api.yml"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: usage-api-production
  cancel-in-progress: false
jobs:
  deploy:
    # Merge-only commits can keep validation running without publishing.
    if: ${{ !contains(github.event.head_commit.message, '[skip deploy]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: node --test usage-api/worker.test.mjs
      - run: python scripts/prepare-usage-assets.py
      - name: Check deployment credentials
        id: credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Usage API not deployed: configure CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID, then rerun this workflow. The website uses limited last-30-day reporting until deployment."
            echo "Usage API deployment skipped: Cloudflare credentials are not configured. Website remains in limited reporting mode." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Apply additive database schema
        if: steps.credentials.outputs.ready == 'true'
        # The Worker is written to run on the schema before and after this file, so a day when D1
        # refuses writes (the free plan's daily limit) doesn't hold back a Worker fix; the schema
        # then applies on the next deploy.
        continue-on-error: true
        working-directory: usage-api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 d1 execute opentune-usage --remote --file=schema.sql
      - name: Deploy existing Worker and database binding
        if: steps.credentials.outputs.ready == 'true'
        working-directory: usage-api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 deploy
      - name: Configure owner login when supplied
        if: steps.credentials.outputs.ready == 'true'
        working-directory: usage-api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          USAGE_ADMIN_USERNAME: ${{ secrets.USAGE_ADMIN_USERNAME }}
          USAGE_ADMIN_PASSWORD: ${{ secrets.USAGE_ADMIN_PASSWORD }}
        run: |
          node configure-login.mjs
      - name: Verify private routes and public reporting
        if: steps.credentials.outputs.ready == 'true'
        env:
          USAGE_ADMIN_USERNAME: ${{ secrets.USAGE_ADMIN_USERNAME }}
          USAGE_ADMIN_PASSWORD: ${{ secrets.USAGE_ADMIN_PASSWORD }}
        run: node usage-api/check-deployment.mjs

