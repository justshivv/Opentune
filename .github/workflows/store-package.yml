name: Prepare store package (no publishing)
on:
  workflow_dispatch:
    inputs:
      format:
        description: Package to prepare
        type: choice
        default: signed-apk
        options: [signed-apk, play-bundle, fdroid-unsigned]
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-37.0 build-tools;36.0.0 ndk;27.2.12479018 cmake;3.22.1
      - uses: gradle/actions/setup-gradle@v4
      - name: Prepare listing files
        run: python scripts/prepare-store-package.py --commit "$GITHUB_SHA" --output dist/store
      - name: Prepare signing key
        if: inputs.format != 'fdroid-unsigned'
        env:
          KEYSTORE_BASE64: ${{ secrets.OPENTUNE_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64" || { echo "Configure the existing OpenTune release signing secrets first."; exit 1; }
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/store.keystore"
          echo "OPENTUNE_KEYSTORE=$RUNNER_TEMP/store.keystore" >> "$GITHUB_ENV"
      - name: Build selected package
        env:
          STORE_FORMAT: ${{ inputs.format }}
          OPENTUNE_KEYSTORE_PASSWORD: ${{ secrets.OPENTUNE_KEYSTORE_PASSWORD }}
          OPENTUNE_KEY_ALIAS: ${{ secrets.OPENTUNE_KEY_ALIAS }}
          OPENTUNE_KEY_PASSWORD: ${{ secrets.OPENTUNE_KEY_PASSWORD }}
        run: |
          case "$STORE_FORMAT" in
            signed-apk) ./gradlew --no-daemon testDebugUnitTest lintDebug assembleRelease; cp app/build/outputs/apk/release/*.apk dist/store/ ;;
            play-bundle) ./gradlew --no-daemon testDebugUnitTest lintDebug bundleRelease; cp app/build/outputs/bundle/release/*.aab dist/store/ ;;
            fdroid-unsigned) ./gradlew --no-daemon testDebugUnitTest lintDebug assembleRelease -PunsignedRelease=true -PuniversalOnly=true; cp app/build/outputs/apk/release/*unsigned.apk dist/store/ ;;
          esac
          cd dist/store
          find . -maxdepth 1 -type f \( -name '*.apk' -o -name '*.aab' \) -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: OpenTune-store-${{ inputs.format }}
          path: dist/store/
      - name: Remove temporary key
        if: always()
        run: rm -f "$RUNNER_TEMP/store.keystore"
