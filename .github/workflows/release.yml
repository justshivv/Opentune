# Pushing a tag like v0.2.0 builds signed release APKs and attaches them to
# a GitHub release.
#
# Signing uses these repository secrets when they're set:
#   OPENTUNE_KEYSTORE_BASE64   the keystore file, base64-encoded
#   OPENTUNE_KEYSTORE_PASSWORD
#   OPENTUNE_KEY_ALIAS
#   OPENTUNE_KEY_PASSWORD
# Without them the APKs are signed with the runner's throwaway debug key:
# they install, but each release would then need uninstalling the last.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: android-actions/setup-android@v3

      - name: Install SDK packages
        run: sdkmanager --install "platforms;android-37.0" "build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@v4

      - name: Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.OPENTUNE_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.keystore"
            echo "OPENTUNE_KEYSTORE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
          else
            echo "No release key set; signing with the debug key."
          fi

      - name: Build
        env:
          OPENTUNE_KEYSTORE_PASSWORD: ${{ secrets.OPENTUNE_KEYSTORE_PASSWORD }}
          OPENTUNE_KEY_ALIAS: ${{ secrets.OPENTUNE_KEY_ALIAS }}
          OPENTUNE_KEY_PASSWORD: ${{ secrets.OPENTUNE_KEY_PASSWORD }}
        run: ./gradlew --no-daemon testDebugUnitTest assembleRelease

      - name: Name the APKs
        run: |
          mkdir dist
          for f in app/build/outputs/apk/release/*.apk; do
            abi=$(basename "$f" .apk | sed -e 's/^app-//' -e 's/-release$//')
            cp "$f" "dist/OpenTune-${GITHUB_REF_NAME}-${abi}.apk"
          done
          (cd dist && sha256sum *.apk > SHA256SUMS.txt)

      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "OpenTune $GITHUB_REF_NAME" --generate-notes
