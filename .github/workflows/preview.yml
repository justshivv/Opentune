# A signed test APK as a workflow artifact: installs over the released app,
# but makes no GitHub release and leaves the website alone. Runs on pushes to
# the working branches, or by hand from the Actions tab (Run workflow).
name: Test APK (no release)
on:
  workflow_dispatch:
  push:
    branches: [feat/http-audio-addons, claude/wizardly-sagan-8ge2ek]
permissions:
  contents: read
concurrency:
  group: preview-${{ github.ref }}
  cancel-in-progress: true
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-37.0 build-tools;36.0.0
      - uses: gradle/actions/setup-gradle@v4
      - name: Prepare signed test build
        env:
          KEYSTORE_BASE64: ${{ secrets.OPENTUNE_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64" || { echo "Release signing key is required for an installable update."; exit 1; }
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/preview.keystore"
          echo "OPENTUNE_KEYSTORE=$RUNNER_TEMP/preview.keystore" >> "$GITHUB_ENV"
          # The current version with "-preview", so it's clear in Settings › About which build this is.
          sed -i 's/versionName = "\([^"]*\)"/versionName = "\1-preview"/' app/build.gradle.kts
          grep -m1 versionName app/build.gradle.kts
      - name: Build test APK
        env:
          OPENTUNE_KEYSTORE_PASSWORD: ${{ secrets.OPENTUNE_KEYSTORE_PASSWORD }}
          OPENTUNE_KEY_ALIAS: ${{ secrets.OPENTUNE_KEY_ALIAS }}
          OPENTUNE_KEY_PASSWORD: ${{ secrets.OPENTUNE_KEY_PASSWORD }}
        run: ./gradlew --no-daemon assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: OpenTune-preview-signed
          path: app/build/outputs/apk/release/*.apk
          retention-days: 14
      - name: Remove temporary key
        if: always()
        run: rm -f "$RUNNER_TEMP/preview.keystore"
