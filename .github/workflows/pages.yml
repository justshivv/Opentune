# Publishes the website in site/ to GitHub Pages whenever it changes on main.
# Pages has to be switched on once: Settings > Pages > Source: GitHub Actions.
name: Website

on:
  push:
    branches: [main]
    paths: ["site/**", "usage-api/dashboard/**", ".github/workflows/pages.yml", "scripts/prepare-usage-assets.py", "scripts/check-published-usage.py"]
  # After every release, so the download buttons name the new build without the
  # page being edited. A release made by the Release workflow's own token doesn't
  # send a release event, hence workflow_run as well.
  workflow_run:
    workflows: ["Release", "iOS"]
    types: [completed]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    # A run on another branch has nothing new for the site.
    if: github.event_name != 'workflow_run' || github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Latest releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${{ github.repository }}/releases?per_page=10" \
            --jq '[.[] | select((.draft or .prerelease) | not) | {tag_name, name, published_at, html_url, assets: [.assets[] | {name, size, browser_download_url}]}]' > releases.raw.json
          # Each release's own changelog lines, read from the tag it was built from.
          echo '{}' > notes.json
          for tag in $(jq -r '.[].tag_name' releases.raw.json); do
            code="$(git show "$tag:app/build.gradle.kts" 2>/dev/null | sed -n 's/.*versionCode = \([0-9]*\).*/\1/p' | head -n 1)"
            file="fastlane/metadata/android/en-US/changelogs/$code.txt"
            if [ -n "$code" ] && git cat-file -e "$tag:$file" 2>/dev/null; then
              git show "$tag:$file" | sed -E 's/^(• |[-*] )//' | grep -v '^[[:space:]]*$' | head -n 4 \
                | jq -R . | jq -s --arg t "$tag" '{($t): .}' > one.json
              jq -s '.[0] * .[1]' notes.json one.json > merged.json && mv merged.json notes.json
            fi
          done
          jq --slurpfile n notes.json '[.[] | . + (if $n[0][.tag_name] then {highlights: $n[0][.tag_name]} else {} end)]' releases.raw.json > site/releases.json
          rm -f releases.raw.json notes.json one.json
          jq -c '.[0] | {tag_name, highlights, apks: [.assets[].name]}' site/releases.json
      - name: iPhone source for SideStore and AltStore
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p site/ios
          cp ios/OpenTune/Resources/Assets.xcassets/AppIcon.appiconset/AppIcon-1024.png site/ios/icon.png
          if ! gh api "repos/${{ github.repository }}/releases/tags/ios" > ios-release.json 2>/dev/null; then
            echo "No iOS build published yet"; rm -f ios-release.json; exit 0
          fi
          base="https://justshivv.github.io/Opentune"
          jq --arg base "$base" '
            (.assets | map(select(.name == "OpenTune-iOS.ipa")) | first) as $ipa
            | if $ipa == null then empty else
            {
              name: "OpenTune",
              identifier: "io.github.justshivv.opentune",
              subtitle: "A free music player",
              sourceURL: ($base + "/ios/source.json"),
              website: ($base + "/"),
              iconURL: ($base + "/ios/icon.png"),
              tintColor: "FF8A65",
              apps: [{
                name: "OpenTune",
                bundleIdentifier: "com.opentune.ios",
                developerName: "justshivv",
                subtitle: "Every song. No ads. No account.",
                localizedDescription: "A free, open-source music player for the YouTube Music catalogue, with synced lyrics, radio once the queue runs out, background play, lock-screen controls and AirPlay. An early version of the Android app.",
                iconURL: ($base + "/ios/icon.png"),
                tintColor: "FF8A65",
                category: "entertainment",
                versions: [{
                  version: (.name | capture("v(?<v>[0-9][0-9.]*)").v),
                  date: $ipa.updated_at,
                  localizedDescription: .body,
                  downloadURL: $ipa.browser_download_url,
                  size: $ipa.size,
                  minOSVersion: "16.0"
                }],
                appPermissions: { entitlements: [], privacy: {} }
              }],
              news: []
            } end' ios-release.json > site/ios/source.json
          rm -f ios-release.json
          [ -s site/ios/source.json ] && jq -c '.apps[0].versions[0] | {version, size}' site/ios/source.json || rm -f site/ios/source.json
      - name: Validate social preview
        run: python scripts/check-social-preview.py
      - name: Version dashboard assets
        run: python scripts/prepare-usage-assets.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify published dashboard assets
        run: python scripts/check-published-usage.py

      - name: Verify published social preview
        run: python scripts/check-social-preview.py --published
