name: Verified add-on clients
on:
  push:
    branches: [feat/first-party-lossless-addon]
    paths: ['app/**', 'core/**', 'web/**', '.github/workflows/addon-verification-clients.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: addon-verification-clients-${{ github.ref }}
  cancel-in-progress: true
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-37.0 build-tools;36.0.0
      - uses: gradle/actions/setup-gradle@v4
      - name: Prepare official signed preview
        env:
          KEYSTORE_BASE64: ${{ secrets.OPENTUNE_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64" || { echo 'Official release signing key is required.'; exit 1; }
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/verification.keystore"
          echo "OPENTUNE_KEYSTORE=$RUNNER_TEMP/verification.keystore" >> "$GITHUB_ENV"
          sed -i 's/versionName = "\([^"]*\)"/versionName = "\1-verification-preview"/' app/build.gradle.kts
      - name: Test public-source isolation
        run: ./gradlew --no-daemon :core:testDebugUnitTest --tests com.opentune.data.addons.FirstPartyAddonAuthTest
      - name: Build Android and TV client
        env:
          OPENTUNE_KEYSTORE_PASSWORD: ${{ secrets.OPENTUNE_KEYSTORE_PASSWORD }}
          OPENTUNE_KEY_ALIAS: ${{ secrets.OPENTUNE_KEY_ALIAS }}
          OPENTUNE_KEY_PASSWORD: ${{ secrets.OPENTUNE_KEY_PASSWORD }}
        run: ./gradlew --no-daemon :app:assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: OpenTune-verified-source-signed
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14
      - name: Remove signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/verification.keystore"
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json
      - run: pnpm install --frozen-lockfile
        working-directory: web
      - run: pnpm typecheck && pnpm test
        working-directory: web
      - run: pnpm --filter @opentune/extension icons && pnpm build:site
        working-directory: web
      - uses: actions/upload-artifact@v4
        with:
          name: OpenTune-verified-source-web
          path: web/app/dist
          if-no-files-found: error
