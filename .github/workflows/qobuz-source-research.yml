name: Qobuz source research
on:
  push:
    branches: ['research/qobuz-source-check-20261024']
    paths: ['scripts/research-qobuz.mjs', '.github/workflows/qobuz-source-research.yml']
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node scripts/research-qobuz.mjs
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install playwright==1.58.0
      - run: python -m playwright install --with-deps chromium
      - run: python scripts/research-jumo-browser.py
      - uses: actions/upload-artifact@v4
        with:
          name: qobuz-source-check
          path: |
            qobuz-source-check.json
            jumo-browser-check.json
